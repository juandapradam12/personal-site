# Content for the Services page — this is a first draft based on your CV,
# edit freely with the actual services you want to offer.

intro: >
  End-to-end Data Science, AI, and Quantum Computing services — from a
  first conversation about your problem to a solution running in
  production.

services:
  - title: Data Science & AI Consulting
    description: >
      Scoping, feasibility studies, and technical strategy for teams
      exploring what Data Science, Machine Learning, or AI can do for them.
  - title: ML & AI Model Development
    description: >
      Design and development of predictive, forecasting, classification,
      and clustering models, and broader AI systems — from classical ML to
      deep learning, NLP, and LLM applications — tailored to the problem
      at hand.
  - title: End-to-End Deployment
    description: >
      A tailor-made solution designed around your requirements and
      technology stack — from data gathering and proof of concept, through
      modelling and software development with a suitable architecture, to
      APIs, containerization, and CI/CD, so the solution keeps running
      reliably in production.
  - title: Research Collaboration
    description: >
      Theoretical and applied research partnerships bridging academia and
      industry, from mathematical modelling to publishable results.
  - title: Quantum Computing Exploration
    description: >
      Early-stage exploration of Quantum Machine Learning, Quantum
      Optimization, and Post-Quantum Cryptography for teams looking ahead.
  - title: Is Your Enterprise Quantum Ready?
    description: >
      A tailor-made roadmap for quantum adoption — assessing where your
      organization stands today and what it needs to prepare for Quantum
      Computing, Quantum Machine Learning, and Post-Quantum Cryptography.

processIntro: >
  Two complementary ways of working — one for delivering production
  systems, one for rigorous research. Same standards of clarity,
  structure, and communication; different emphasis where it matters.

workflows:
  - id: industry
    label: Industry
    title: End-to-end delivery
    subtitle: From problem framing to a system running in production
    outcome: Best for product, operations, and applied AI initiatives with clear business goals.
    steps:
      - title: Requirements & scoping
        description: Clarify objectives, constraints, success metrics, and stakeholders.
      - title: Data collection & exploration
        description: Gather, audit, and understand the data landscape.
      - title: Modelling & algorithm design
        description: Choose and design the right mathematical and ML approach.
      - title: Software architecture & development
        description: Build maintainable systems with a suitable architecture.
      - title: Deployment & CI/CD
        description: Ship reliably — containers, pipelines, and environments.
      - title: Monitoring & iteration
        description: Track performance in production and refine over time.
      - title: Results & stakeholder communication
        description: Present outcomes clearly and keep decision-makers aligned.

  - id: research
    label: Research
    title: Research collaboration
    subtitle: From research question to publishable insight
    outcome: Best for R&D, academic partnerships, and problems that need first-principles depth.
    steps:
      - title: Research question
        description: Define the problem with precision and scientific relevance.
      - title: Literature & state of the art
        description: Map prior work and identify the gap to address.
      - title: Theoretical modelling
        description: Formalise the problem with mathematics, physics, or algorithms.
      - title: Experimentation & simulation
        description: Design experiments, run simulations, or analyse data.
      - title: Validation & analysis
        description: Test hypotheses rigorously and interpret results.
      - title: Documentation & publication
        description: Write up methods and findings for papers, reports, or talks.
      - title: Knowledge transfer
        description: Translate results into industry applications when relevant.

processPrinciples:
  - Rigour before shortcuts
  - Clear communication with stakeholders
  - Reproducible methods and documented decisions
  - Bridge between theory and real-world impact

