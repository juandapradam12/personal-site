research:
  - title: Multi-Domain Spectral Approach for the Computation of Fourier Transform
    affiliation: Université Bourgogne Franche-Comté
    period: Sep 2021 — Present
    description: >
      Efficient computation of the Fourier Transform with a numerical spectral
      algorithm via deformation techniques, improving accuracy of numerical
      solutions of partial differential equations, with further applications
      to medical imaging.

  - title: Quantum Field Theory, Anomalies and Topological Phases
    affiliation: Universidad de los Andes
    period: Jan 2020 — Present
    description: >
      Research Project INV-2019-84-1833, Ministerio de Ciencias, in the field
      of Topological Phase Transitions and Non-Commutative Geometry in
      Quantum Electrodynamics.

  - title: Quantum Fields with Dynamical Boundary Conditions
    affiliation: Universidad de los Andes
    period: Mar 2019 — Dec 2019
    description: >
      Studied aspects of Quantum Field Theory in flat and curved spacetimes
      in the context of the Casimir effect with subtle modifications on
      spacetime, observing that changes on vacuum introduce changes on
      observables of the physical system.

  - title: SPDC Characterization on Liquid Phase Exfoliated 2D Crystals for Piezoelectric Devices
    affiliation: Universidad de los Andes
    period: Jan 2019 — Aug 2019
    description: >
      Characterized non-linear behavior of crystals, studying Spontaneous
      Parametric Down Conversion (SPDC) with the aim of obtaining a
      piezoelectric response on the material.

  - title: "Compactificación de la métrica de Schwarzschild y estructuras causales"
    affiliation: Universidad de los Andes
    period: Aug 2018 — Dec 2018
    description: >
      Multi-disciplinary approach from Mathematics, Philosophy, and Computer
      Science to understand Schwarzschild metric compactification and its
      causality implications, complemented by computer simulations on the
      Einstein-Rosen black hole as an introduction to the Raychaudhuri
      equation and the Singularity Theorems.

  - title: "Seminar on Quantum Field Theory and Mathematical Physics: Non-trivial Geometrical Effects on Flat Space-time"
    affiliation: Universidad de los Andes
    period: Aug 2018 — Nov 2018
    description: >
      Discussion of the quantum vacuum from the point of view of the
      Poincaré group of symmetries, studying phenomena such as the Casimir
      effect on a bidimensional cylinder, accelerated expansion space-time,
      and Rindler space-time using Quantum Field Theory on curved space-time.

