summary: >
  Senior Data Scientist and Mathematical-Physicist with 6+ years of commercial
  experience in applied data science, algorithm engineering, and technical
  leadership, operating autonomously across end-to-end ML/AI projects for
  Finance, Cybersecurity, Sports & Entertainment, Smart Cities, Government,
  and Scientific Research. Hands-on expertise in Machine Learning, Deep
  Learning, MLOps, predictive modelling, solution architecture, and
  production deployment, applied to fraud and anomaly detection, adaptive
  authentication, risk-based decision systems, NLP, and LLM applications. My
  academic background in Mathematical Physics and Applied Mathematics lets me
  approach problems from first principles, bridging rigorous scientific
  thinking with practical software engineering. I am currently expanding into
  Quantum Computing — Quantum Machine Learning, Quantum Optimization, and
  Post-Quantum Cryptography — with the goal of bridging Research and Industry
  through production-ready solutions with real-world impact.

