story: >
  With a strong academic background in Mathematical Physics and Applied
  Mathematics, and driven by a passion for solving real-world, challenging
  problems, I've built my career across Data Science, Artificial
  Intelligence, Machine Learning, and Quantum Computing.

  I enjoy contributing my grain of sand to society by turning theoretical
  knowledge into practical solutions with real impact — building algorithms
  that create real value for people and organizations.

  Along the way, I've had the fortune of working across a wide range of
  industries and organizations — from startups to large corporations, and
  from academia to government — as well as across a broad range of
  cultures.

